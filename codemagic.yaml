# Codemagic CI/CD — Caminare (Fase 3)
# Dois workflows: Android (compila aqui mesmo) e iOS (scaffold + build no Mac da CI,
# já que a pasta ios/ não é versionada — foi gerada só no Codemagic).
#
# Antes do primeiro build, configure no Codemagic:
#  - Android: grupo de variáveis "android_signing" com o keystore (CM_KEYSTORE,
#    CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD) e a conta de serviço do
#    Google Play (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) p/ publicação.
#  - iOS: integração "App Store Connect API key" + certificado de distribuição.
#    Ajuste o bundle id com.caminare.app e o team id.
#  - Variáveis do app (build web): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
#    NÃO defina VITE_SHOW_DEV_TOOLS (painel de teste fica escondido em produção).

workflows:
  android:
    name: Android (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - android_signing
        - app_env
      node: 20
      java: 17
    scripts:
      - name: Instalar dependências
        script: npm install
      - name: Gerar ícone do Android a partir de assets/icon.png
        script: |
          # Deriva as 2 camadas do ícone adaptativo (coruja branca transparente +
          # fundo roxo) a partir do MESMO assets/icon.png que o iOS usa, e regenera
          # os mipmaps. O script fica na RAIZ do projeto p/ o require('sharp') achar
          # o pacote (sharp vem junto do @capacitor/assets, instalado no npm ci).
          cat > _gen-icon.cjs <<'EOF'
          const sharp = require('sharp');
          (async () => {
            const src = 'assets/icon.png';
            const { data } = await sharp(src).raw().toBuffer({ resolveWithObject: true });
            const bg = { r: data[0], g: data[1], b: data[2], alpha: 1 };
            // Recorta a margem roxa do icon.png (sobra só a coruja, com o traço EXATO)
            // e escala p/ ~76% do quadro — o MESMO tamanho que a coruja ocupa no
            // icon.png que o iOS usa (da ponta da orelha ao bico de baixo, ~76% da
            // altura). Assim o ícone do Android fica do tamanho do iPhone. Obs.: como
            // o Android corta as bordas pra fazer o formato redondo, a pontinha das
            // orelhas pode encostar no corte em alguns launchers redondos — opção
            // escolhida (tamanho igual ao iPhone) em vez de coruja menor.
            const owl = await sharp(src).trim().toBuffer();
            const m = await sharp(owl).metadata();
            const F = 1024, target = Math.round(F * 0.76), scale = target / Math.max(m.width, m.height);
            const owlR = await sharp(owl).resize(Math.round(m.width * scale), Math.round(m.height * scale)).toBuffer();
            await sharp({ create: { width: F, height: F, channels: 4, background: bg } })
              .composite([{ input: owlR, gravity: 'center' }]).png().toFile('assets/icon-foreground.png');
            await sharp({ create: { width: F, height: F, channels: 4, background: bg } })
              .png().toFile('assets/icon-background.png');
            console.log('icone: coruja recortada ~84%; fundo', bg);
          })();
          EOF
          node _gen-icon.cjs
          npx @capacitor/assets generate --android
      - name: Gerar .env de produção
        script: |
          printf "VITE_SUPABASE_URL=%s\n" "$VITE_SUPABASE_URL" > .env.production
          printf "VITE_SUPABASE_ANON_KEY=%s\n" "$VITE_SUPABASE_ANON_KEY" >> .env.production
          printf "VITE_API_BASE_URL=%s\n" "$VITE_API_BASE_URL" >> .env.production
          echo "URL len: ${#VITE_SUPABASE_URL} | ANON len: ${#VITE_SUPABASE_ANON_KEY} | API_BASE: ${VITE_API_BASE_URL:-(vazio/relativo)}"
      - name: Build web + sync Capacitor
        script: npm run native:build
      - name: Configurar keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > "$CM_BUILD_DIR/release.keystore"
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_BUILD_DIR/release.keystore
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build AAB (release)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    # 1º build: ainda NÃO temos a conta de serviço do Google Play. Vamos baixar o
    # .aab dos artifacts e subir manualmente na Play Console. Quando a conta de
    # serviço (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) estiver configurada, descomente.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  ios:
    name: iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      groups:
        - app_env
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências
        script: npm install
      - name: Gerar .env de produção
        script: |
          printf "VITE_SUPABASE_URL=%s\n" "$VITE_SUPABASE_URL" > .env.production
          printf "VITE_SUPABASE_ANON_KEY=%s\n" "$VITE_SUPABASE_ANON_KEY" >> .env.production
          printf "VITE_API_BASE_URL=%s\n" "$VITE_API_BASE_URL" >> .env.production
          echo "URL len: ${#VITE_SUPABASE_URL} | ANON len: ${#VITE_SUPABASE_ANON_KEY} | API_BASE: ${VITE_API_BASE_URL:-(vazio/relativo)}"
      - name: Build web
        script: npm run build
      - name: Adicionar plataforma iOS (não versionada)
        script: |
          npx cap add ios || true
          npx cap sync ios
          # Ícones + splash da marca (coruja) a partir de assets/. A pasta ios/ só
          # existe aqui no CI, então geramos os ícones do iOS neste passo (no
          # Android os assets já vêm versionados em android/.../res/).
          npx @capacitor/assets generate --ios
      - name: Configurar iOS (deep links + entitlements)
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          # Esquema custom de deep link (com.caminare.app://) — o Info.plist gerado
          # pelo Capacitor não traz; adiciona via PlistBuddy (idempotente).
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.caminare.app" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.caminare.app" "$PLIST"
          # Permissões de voz (gravação por voz com transcrição nativa). O Info.plist
          # gerado pelo Capacitor não traz; sem estas strings o iOS rejeita o uso de
          # microfone/SFSpeechRecognizer (crash) e a App Store reprova. Idempotente.
          MIC_MSG="O Caminare usa o microfone para transcrever sua fala em texto no seu registro."
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC_MSG" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string $MIC_MSG" "$PLIST"
          # Conformidade de exportação (encryption): o app só usa HTTPS/criptografia
          # padrão (isenta), então declaramos ITSAppUsesNonExemptEncryption=false. Sem
          # isto a App Store bloqueia cada build pedindo a resposta manual. Idempotente.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # Idiomas do app (o que a App Store exibe em "IDIOMA" na ficha). O binário
          # gerado pelo Capacitor declara só inglês, então a loja mostrava "EN" mesmo
          # o app sendo bilíngue. Declaramos pt-BR (região de desenvolvimento) + en
          # como localizações suportadas. Idempotente.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion pt-BR" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string pt-BR" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string pt-BR" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$PLIST"
          # Versão do build (CFBundleVersion): o App Store Connect exige que cada upload
          # tenha um build number MAIOR que o anterior. O Capacitor gera CFBundleVersion=1
          # fixo, então o 2º upload falha ("must be higher than '1'"). Usamos o
          # $BUILD_NUMBER do Codemagic (sempre incrementa) p/ garantir número único e maior.
          # O CFBundleShortVersionString (versão de marketing) fica em 1.0.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 3.1.0" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 3.1.0" "$PLIST"
          # Entitlements: só Sign in with Apple. O associated-domains (Universal Links)
          # está desativado em native/ios/App.entitlements enquanto o domínio de produção
          # não existe (o placeholder quebrava a assinatura). Restaurar lá quando houver domínio.
          cp native/ios/App.entitlements ios/App/App/App.entitlements
          # GoogleService-Info.plist (Firebase Analytics). A pasta ios/ é gerada no CI,
          # então copiamos o plist versionado pra dentro do target. Só copiar não basta:
          # ele precisa estar REGISTRADO como recurso do target pra ir no bundle — feito
          # no ruby abaixo.
          cp native/ios/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          # ⚠️ CRÍTICO: copiar o arquivo NÃO basta. O template iOS do Capacitor não seta
          # CODE_SIGN_ENTITLEMENTS, então o Xcode ignora o App.entitlements e o IPA assinado
          # sai SEM a entitlement com.apple.developer.applesignin. Resultado: "Sign in with
          # Apple" falha em runtime com ASAuthorizationError 1000 (.unknown) — foi o que a
          # Apple reprovou (2.1a). Aqui apontamos o build setting p/ o arquivo em TODAS as
          # configs do target "App" via o gem xcodeproj (pré-instalado no Mac do Codemagic).
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" } or abort("target App nao encontrado")
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
              puts "CODE_SIGN_ENTITLEMENTS -> App/App.entitlements (#{c.name})"
            end
            # Registra o GoogleService-Info.plist como recurso do target App (o Firebase
            # precisa do arquivo no bundle do app). Idempotente.
            app_group = project.main_group["App"]
            already = target.resources_build_phase.files.any? { |bf| bf.file_ref && bf.file_ref.display_name == "GoogleService-Info.plist" }
            unless already
              ref = app_group.new_file("GoogleService-Info.plist")
              target.resources_build_phase.add_file_reference(ref, true)
              puts "GoogleService-Info.plist registrado nos recursos do target App"
            end
            project.save
          '
      - name: Instalar pods
        script: |
          cd ios/App && pod install
      - name: Configurar code signing
        script: |
          set -e
          keychain initialize
          # --certificate-key: a conta não tem certificado de distribuição, então o
          # --create precisa GERAR um, e pra isso precisa da chave privada RSA. Ela
          # vem da var segura CERTIFICATE_PRIVATE_KEY (grupo app_env no Codemagic).
          app-store-connect fetch-signing-files "com.caminare.app" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Aplica os perfis ao projeto (seta CODE_SIGN_STYLE=Manual, team e specifier
          # no target "App" e gera o export_options.plist). Isto já basta pra assinar.
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
